# =============================================================================
# nginx 設定 — VANZAI Portal
# /etc/nginx/sites-available/vanzai
# =============================================================================

# ----------------------------------------------------------------
# admin-web: vanzai-portal.com / www.vanzai-portal.com
# ----------------------------------------------------------------
server {
    listen 80;
    server_name vanzai-portal.com www.vanzai-portal.com;

    root /var/www/vanzai/apps/admin-web/dist;
    index index.html;

    # React Router (SPA) 対応
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的ファイルキャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/admin-web-access.log;
    error_log  /var/log/nginx/admin-web-error.log;
}

# ----------------------------------------------------------------
# staff-mobile: staff.vanzai-portal.com
# ----------------------------------------------------------------
server {
    listen 80;
    server_name staff.vanzai-portal.com;

    root /var/www/vanzai/apps/staff-mobile/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/staff-mobile-access.log;
    error_log  /var/log/nginx/staff-mobile-error.log;
}

# ----------------------------------------------------------------
# API: api.vanzai-portal.com → localhost:8000
# ----------------------------------------------------------------
server {
    listen 80;
    server_name api.vanzai-portal.com;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;
}
