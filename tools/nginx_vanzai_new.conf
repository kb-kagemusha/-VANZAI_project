# =============================================================================
# nginx 險ｭ螳・窶・VANZAI Portal
# /etc/nginx/sites-available/vanzai
# ============================================================================= 

# ----------------------------------------------------------------
# admin-web: vanzai-portal.com / www.vanzai-portal.com
# ----------------------------------------------------------------
server {
    server_name vanzai-portal.com www.vanzai-portal.com;

    root /var/www/vanzai/apps/admin-web/dist;
    index index.html;

    # React Router (SPA) 蟇ｾ蠢・    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 縺ｯ蟶ｸ縺ｫ譛譁ｰ繧定ｿ斐☆・・PA 縺ｮ繧ｨ繝ｳ繝医Μ繝昴う繝ｳ繝茨ｼ・    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Service Worker 縺ｯ no-cache・医ヶ繝ｩ繧ｦ繧ｶ縺悟ｸｸ縺ｫ譖ｴ譁ｰ繝√ぉ繝・け縺ｧ縺阪ｋ繧医≧・・    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 髱咏噪繝輔ぃ繧､繝ｫ繧ｭ繝｣繝・す繝･・医ワ繝・す繝･莉倥″繝輔ぃ繧､繝ｫ蜷阪↑縺ｮ縺ｧ髟ｷ譛溘く繝｣繝・す繝･ OK・・    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/admin-web-access.log;
    error_log  /var/log/nginx/admin-web-error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vanzai-portal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vanzai-portal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot       
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ----------------------------------------------------------------
# staff-mobile: staff.vanzai-portal.com
# ----------------------------------------------------------------
server {
    server_name staff.vanzai-portal.com;

    root /var/www/vanzai/apps/staff-mobile/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 縺ｯ蟶ｸ縺ｫ譛譁ｰ繧定ｿ斐☆・・PA 縺ｮ繧ｨ繝ｳ繝医Μ繝昴う繝ｳ繝茨ｼ・    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Service Worker 縺ｯ no-cache・医ヶ繝ｩ繧ｦ繧ｶ縺悟ｸｸ縺ｫ譖ｴ譁ｰ繝√ぉ繝・け縺ｧ縺阪ｋ繧医≧・・    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }


    location ~ ^/favicon(-32)?\.(svg|png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~*