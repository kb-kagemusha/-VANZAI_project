# =============================================================================
# nginx 設定 — VANZAI Portal
# /etc/nginx/sites-available/vanzai
# ============================================================================= 

# ----------------------------------------------------------------
# admin-web: vanzai-portal.com / www.vanzai-portal.com
# ----------------------------------------------------------------
server {
    server_name vanzai-portal.com www.vanzai-portal.com;

    root /var/www/vanzai/apps/admin-web/dist;
    index index.html;

    # React Router (SPA) 対応
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html は常に最新を返す（SPA のエントリポイント）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Service Worker は no-cache（ブラウザが常に更新チェックできるよう）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # favicon は短期キャッシュ（ブランド更新を反映しやすくする）
    location ~ ^/favicon(-32)?\.(svg|png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 静的ファイルキャッシュ（ハッシュ付きファイル名なので長期キャッシュ OK）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/admin-web-access.log;
    error_log  /var/log/nginx/admin-web-error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vanzai-portal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vanzai-portal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot       
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ----------------------------------------------------------------
# staff-mobile: staff.vanzai-portal.com
# ----------------------------------------------------------------
server {
    server_name staff.vanzai-portal.com;

    root /var/www/vanzai/apps/staff-mobile/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html は常に最新を返す（SPA のエントリポイント）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Service Worker は no-cache（ブラウザが常に更新チェックできるよう）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~ ^/favicon(-32)?\.(svg|png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/staff-mobile-access.log;
    error_log  /var/log/nginx/staff-mobile-error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vanzai-portal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vanzai-portal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot       
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ----------------------------------------------------------------
# API: api.vanzai-portal.com → localhost:8000
# ----------------------------------------------------------------
server {
    server_name api.vanzai-portal.com;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;        
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vanzai-portal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vanzai-portal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot       
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.vanzai-portal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = vanzai-portal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name vanzai-portal.com www.vanzai-portal.com;
    return 404; # managed by Certbot




}
server {
    if ($host = api.vanzai-portal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.vanzai-portal.com;
    return 404; # managed by Certbot


}
server {
    if ($host = staff.vanzai-portal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name staff.vanzai-portal.com;
    return 404; # managed by Certbot


}
